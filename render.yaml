services:
  # Backend API Service
  - type: web
    name: ats-resume-scorer-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JSEARCH_API_KEY
        sync: false
      - key: JSEARCH_API_HOST
        value: jsearch.p.rapidapi.com
      - key: PORT
        value: 5000
